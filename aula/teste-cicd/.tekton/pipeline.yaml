# ============================================================
# 1. PIPELINE
# ============================================================

apiVersion: tekton.dev/v1
kind: Pipeline

metadata:
  name: teste-pipeline

spec:
  params:

    - name: git-url
      type: string
      description: URL do repositório Git

    - name: git-revision
      type: string
      description: Branch ou revisão do Git
      default: main

    - name: image-name
      type: string
      description: Nome da imagem que será criada
      default: teste-cicd

    - name: registry-namespace
      type: string
      description: Namespace do IBM Container Registry

    - name: registry-region
      type: string
      description: Região do IBM Container Registry
      default: us-south

  workspaces:

    - name: source

  tasks:

    # --------------------------------------------------------
    # CLONE DO REPOSITÓRIO
    # --------------------------------------------------------

    - name: clone

      taskRef:
        name: git-clone-repo

      params:

        - name: url
          value: $(params.git-url)

        - name: revision
          value: $(params.git-revision)

      workspaces:

        - name: output
          workspace: source


    # --------------------------------------------------------
    # BUILD + PUSH DA IMAGEM
    # --------------------------------------------------------

    - name: build-image

      runAfter:
        - clone

      taskRef:
        name: icr-containerize

      params:

        - name: registry-region
          value: $(params.registry-region)

        - name: registry-namespace
          value: $(params.registry-namespace)

        - name: image-name
          value: $(params.image-name)

        - name: path-to-context
          value: "aula/teste-cicd"

        - name: path-to-dockerfile
          value: "aula/teste-cicd"

        - name: dockerfile
          value: "Dockerfile"

      workspaces:

        - name: source
          workspace: source


---
# ============================================================
# 2. TRIGGER BINDING
# ============================================================

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding

metadata:
  name: teste-pipeline-binding

spec:
  params:

    - name: git-url
      value: $(body.repository.clone_url)

    - name: git-revision
      value: $(body.ref)

    - name: image-name
      value: teste-cicd

    - name: registry-namespace
      value: SEU_NAMESPACE

    - name: registry-region
      value: us-south


---
# ============================================================
# 3. TRIGGER TEMPLATE
# ============================================================

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate

metadata:
  name: teste-pipeline-template

spec:

  params:

    - name: git-url

    - name: git-revision

    - name: image-name

    - name: registry-namespace

    - name: registry-region

  resourcetemplates:

    - apiVersion: tekton.dev/v1
      kind: PipelineRun

      metadata:
        generateName: teste-pipeline-

      spec:

        pipelineRef:
          name: teste-pipeline

        params:

          - name: git-url
            value: $(tt.params.git-url)

          - name: git-revision
            value: $(tt.params.git-revision)

          - name: image-name
            value: $(tt.params.image-name)

          - name: registry-namespace
            value: $(tt.params.registry-namespace)

          - name: registry-region
            value: $(tt.params.registry-region)

        workspaces:

          - name: source
            emptyDir: {}


---
# ============================================================
# 4. EVENT LISTENER
# ============================================================

apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener

metadata:
  name: teste-pipeline-listener

spec:

  triggers:

    - name: teste-pipeline-trigger

      bindings:

        - ref: teste-pipeline-binding

      template:

        ref: teste-pipeline-template