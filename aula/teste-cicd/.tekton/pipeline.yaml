apiVersion: tekton.dev/v1
kind: Pipeline

metadata:
  name: teste-pipeline

spec:

  params:

    - name: git-url
      type: string
      description: URL do repositório Git
      default: "https://github.com/esensato/icl-2026-02.git"

    - name: git-revision
      type: string
      description: Branch ou revisão
      default: "main"

    - name: image-name
      type: string
      description: Nome da imagem no IBM Container Registry
      default: "teste-cicd"

    - name: registry-namespace
      type: string
      description: Namespace do IBM Container Registry
      default: "SEU_NAMESPACE"

    - name: registry-region
      type: string
      description: Região do IBM Container Registry
      default: "us-south"

  workspaces:

    - name: source

  tasks:

    # ============================================================
    # 1. CLONA O REPOSITÓRIO
    # ============================================================

    - name: clone

      taskRef:
        name: git-clone-repo

      params:

        - name: url
          value: $(params.git-url)

        - name: revision
          value: $(params.git-revision)

      workspaces:

        - name: output
          workspace: source


    # ============================================================
    # 2. BUILD + PUSH DA IMAGEM
    # ============================================================

    - name: build-image

      runAfter:
        - clone

      taskRef:
        name: icr-containerize

      params:

        - name: registry-region
          value: $(params.registry-region)

        - name: registry-namespace
          value: $(params.registry-namespace)

        - name: image-name
          value: $(params.image-name)

        - name: path-to-context
          value: "."

        - name: path-to-dockerfile
          value: "."

        - name: dockerfile
          value: "Dockerfile"

      workspaces:

        - name: source
          workspace: source