apiVersion: tekton.dev/v1
kind: Pipeline

metadata:
  name: teste-pipeline

spec:
  params:
    - name: repo-url
      type: string

    - name: revision
      type: string
      default: main

    - name: image
      type: string
      description: Nome completo da imagem a ser publicada

  workspaces:
    - name: source

  tasks:

    - name: clone
      taskRef:
        name: git-clone

      params:
        - name: url
          value: $(params.repo-url)

        - name: revision
          value: $(params.revision)

        - name: deleteExisting
          value: "true"

      workspaces:
        - name: output
          workspace: source

    - name: build-and-push
      runAfter:
        - clone

      taskRef:
        name: kaniko

      params:
        - name: IMAGE
          value: $(params.image)

        - name: DOCKERFILE
          value: ./Dockerfile

        - name: CONTEXT
          value: $(workspaces.source.path)

      workspaces:
        - name: source
          workspace: source

kind: PipelineRun

metadata:
  name: teste-pipeline-run

  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"

spec:
  pipelineRef:
    name: teste-pipeline

  params:
    - name: repo-url
      value: "{{repo_url}}"

    - name: revision
      value: "{{revision}}"

    - name: image
      value: "ghcr.io/minha-organizacao/teste:latest"

  workspaces:
    - name: source
      emptyDir: {}

kind: TriggerBinding

metadata:
  name: teste-cicd-binding

spec:

  params:

    - name: git-url
      value: $(body.repository.clone_url)

    - name: git-revision
      value: $(body.ref)

kind: TriggerTemplate

metadata:
  name: teste-cicd-template

spec:

  params:

    - name: git-url

    - name: git-revision

    - name: image

  resourcetemplates:
