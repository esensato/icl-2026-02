# ============================================================
# TASK: CLONE DO REPOSITÓRIO
# ============================================================

apiVersion: tekton.dev/v1
kind: Task

metadata:
  name: git-clone-repo

spec:

  params:

    - name: url
      type: string
      description: URL do repositório Git

    - name: revision
      type: string
      default: main
      description: Branch ou commit

  workspaces:

    - name: output
      description: Workspace onde o repositório será clonado

  steps:

    - name: clone

      image: alpine/git:latest

      script: |

        # Remove conteúdo anterior do workspace
        rm -rf "$(workspaces.output.path)"/*

        echo "Clonando:"
        echo "$(params.url)"

        echo "Revision:"
        echo "$(params.revision)"

        git clone \
          --depth 1 \
          --branch "$(params.revision)" \
          "$(params.url)" \
          "$(workspaces.output.path)"


---
# ============================================================
# PIPELINE
# ============================================================

apiVersion: tekton.dev/v1
kind: Pipeline

metadata:
  name: teste-pipeline

spec:

  params:

    - name: git-url
      type: string
      description: URL do repositório Git
      default: "https://github.com/esensato/icl-2026-02.git"

    - name: git-revision
      type: string
      description: Branch do Git
      default: main

    - name: image-name
      type: string
      description: Nome da imagem
      default: teste-cicd

    - name: registry-namespace
      type: string
      description: Namespace do IBM Container Registry
      default: SEU_NAMESPACE

    - name: registry-region
      type: string
      description: Região do IBM Container Registry
      default: us-south

  workspaces:

    - name: source

  tasks:

    # --------------------------------------------------------
    # CLONE
    # --------------------------------------------------------

    - name: clone

      taskRef:
        name: git-clone-repo

      params:

        - name: url
          value: $(params.git-url)

        - name: revision
          value: $(params.git-revision)

      workspaces:

        - name: output
          workspace: source


    # --------------------------------------------------------
    # BUILD + PUSH
    # --------------------------------------------------------

    - name: build-image

      runAfter:
        - clone

      taskRef:
        name: icr-containerize

      params:

        - name: registry-region
          value: $(params.registry-region)

        - name: registry-namespace
          value: $(params.registry-namespace)

        - name: image-name
          value: $(params.image-name)

        - name: path-to-context
          value: "aula/teste-cicd"

        - name: path-to-dockerfile
          value: "aula/teste-cicd"

        - name: dockerfile
          value: "Dockerfile"

      workspaces:

        - name: source
          workspace: source


---
# ============================================================
# TRIGGER BINDING
# ============================================================

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding

metadata:
  name: teste-pipeline-binding

spec:

  params:

    - name: git-url
      value: $(body.repository.clone_url)

    - name: git-revision
      value: $(body.ref)

    - name: image-name
      value: teste-cicd

    - name: registry-namespace
      value: SEU_NAMESPACE

    - name: registry-region
      value: us-south


---
# ============================================================
# TRIGGER TEMPLATE
# ============================================================

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate

metadata:
  name: teste-pipeline-template

spec:

  params:

    - name: git-url

    - name: git-revision

    - name: image-name

    - name: registry-namespace

    - name: registry-region

  resourcetemplates:

    - apiVersion: tekton.dev/v1

      kind: PipelineRun

      metadata:
        generateName: teste-pipeline-

      spec:

        pipelineRef:
          name: teste-pipeline

        params:

          - name: git-url
            value: $(tt.params.git-url)

          - name: git-revision
            value: $(tt.params.git-revision)

          - name: image-name
            value: $(tt.params.image-name)

          - name: registry-namespace
            value: $(tt.params.registry-namespace)

          - name: registry-region
            value: $(tt.params.registry-region)

        workspaces:

          - name: source
            emptyDir: {}


---
# ============================================================
# EVENT LISTENER
# ============================================================

apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener

metadata:
  name: teste-pipeline-listener

spec:

  triggers:

    - name: teste-pipeline-trigger

      bindings:

        - ref: teste-pipeline-binding

      template:

        ref: teste-pipeline-template